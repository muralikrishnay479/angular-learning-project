<section class="student-list">
  <h2>Student list</h2>
  <p>The list receives students from its parent and creates one card per student.</p>

  @if (students.length === 0) {
    <p>No students remain.</p>
  } @else {
    @for (student of students; track student.id) {
      <app-student-card
        [student]="student"
        [selected]="selectedStudentId === student.id"
        (studentSelected)="selectStudent($event)"
        (deleteRequested)="deleteStudent($event)"
      />
      <a class="details-link" [routerLink]="[student.id]">Open {{ student.name }} details</a>
    }
  }
</section>
