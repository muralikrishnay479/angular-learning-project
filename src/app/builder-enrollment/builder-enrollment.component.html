<main class="builder-page">
  <h1>Student Enrollment with FormBuilder</h1>
  <p>This page creates its FormGroup through FormBuilder.</p>

  <form [formGroup]="enrollmentForm" (ngSubmit)="onSubmit()" novalidate>
    <label for="builder-name">Student name</label>
    <input id="builder-name" type="text" formControlName="studentName">

    <label for="builder-email">Email</label>
    <input id="builder-email" type="email" formControlName="email">

    <label for="builder-course">Course</label>
    <select id="builder-course" formControlName="course">
      <option value="">Choose a course</option>
      <option value="Angular Fundamentals">Angular Fundamentals</option>
      <option value="TypeScript for Web Apps">TypeScript for Web Apps</option>
    </select>

    <label for="builder-age">Age</label>
    <input id="builder-age" type="number" formControlName="age">

    <button type="submit">Submit</button>
    <button type="button" (click)="resetForm()">Reset</button>
  </form>

  <section class="examples">
    <h2>Value update examples</h2>
    <button type="button" (click)="loadCompleteExample()">
      Load complete value with setValue()
    </button>
    <button type="button" (click)="updateNameOnly()">
      Update only the name with patchValue()
    </button>
  </section>

  @if (enrollmentForm.invalid && enrollmentForm.touched) {
    <p class="error">Please complete the form correctly.</p>
  }

  @if (submitted) {
    <p class="success">The FormBuilder form is valid and ready to process.</p>
  }
</main>
